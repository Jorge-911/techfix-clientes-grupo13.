{% extends 'clientes/base.html' %}{% block content %}<h1>Clientes</h1><form method="get"><label for="q">Identificación exacta</label> <input id="q" name="q" value="{{ q }}"><button>Buscar</button></form><table><thead><tr><th>Identificación</th><th>Nombres</th><th>Acción</th></tr></thead><tbody>{% for cliente in clientes %}<tr><td>{{ cliente.identificacion }}</td><td>{{ cliente.nombres }}</td><td><a href="{% url 'clientes:detalle' cliente.pk %}">Ver detalle</a></td></tr>{% empty %}<tr><td colspan="3">No se encontraron clientes</td></tr>{% endfor %}</tbody></table>{% endblock %}
