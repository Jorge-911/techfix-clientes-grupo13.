<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TechFix Manager</title><style>body{font:17px system-ui;margin:0;background:#eef3f8;color:#172b46}header{background:#13334d;color:white;padding:22px}main{max-width:900px;margin:32px auto;padding:28px;background:white;border-radius:14px}a{color:#006a78}input{padding:10px;max-width:95%}button{padding:10px 18px;background:#087f8c;color:white;border:0;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd}.errorlist{color:#a32020}.mensaje{background:#e1f3e8;padding:12px}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}</style></head><body><header>TechFix Manager · Gestión de clientes</header><main>{% if user.is_authenticated %}<nav><a href="{% url 'clientes:inicio' %}">Clientes</a>{% if perms.clientes.add_cliente %}<a href="{% url 'clientes:nuevo' %}">Nuevo cliente</a>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Salir</button></form></nav>{% endif %}{% for message in messages %}<p class="mensaje">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
